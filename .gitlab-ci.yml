image: docker:24.0.5

services:
  - docker:24.0.5-dind

variables:
  AWS_DEFAULT_REGION: eu-west-1
  REPOSITORY_URI: 209479311569.dkr.ecr.eu-west-1.amazonaws.com/cmtr-ac643e5v-static
  DOCKER_HOST: tcp://docker:2375
  DOCKER_TLS_CERTDIR: ""

stages:
  - build-and-push

build-and-push:
  stage: build-and-push
  before_script:
    - apk add --no-cache aws-cli
    - AWS_TOKEN=$(aws ecr get-login-password --region $AWS_DEFAULT_REGION)
    - echo $AWS_TOKEN | docker login --username AWS --password-stdin $REPOSITORY_URI
  script:
    - docker build -t $REPOSITORY_URI:latest -t $REPOSITORY_URI:$CI_COMMIT_SHA .
    - docker push $REPOSITORY_URI:latest
    - docker push $REPOSITORY_URI:$CI_COMMIT_SHA