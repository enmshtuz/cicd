stages:
  - build
  - push

variables:
  AWS_DEFAULT_REGION: "us-east-1"
  AWS_ACCOUNT_ID: "207567784907"
  ECR_REPOSITORY: "cmtr-2dfktx7p-static"

  IMAGE_TAG: "$CI_COMMIT_SHA"
  IMAGE_LATEST: "latest"

  # Docker-in-Docker without TLS for this GitLab runner
  DOCKER_HOST: "tcp://docker:2375"
  DOCKER_TLS_CERTDIR: ""

build_image:
  stage: build

  image: docker:29.8.0-cli

  services:
    - name: docker:29.8.0-dind
      alias: docker
      variables:
        HEALTHCHECK_TCP_PORT: "2375"

  script:
    - echo "Building Docker image..."
    - docker version
    - export ECR_REGISTRY="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_DEFAULT_REGION}.amazonaws.com"
    - export ECR_IMAGE="${ECR_REGISTRY}/${ECR_REPOSITORY}"
    - docker build --platform linux/amd64 -t "${ECR_IMAGE}:${IMAGE_TAG}" .
    - docker tag "${ECR_IMAGE}:${IMAGE_TAG}" "${ECR_IMAGE}:${IMAGE_LATEST}"
    - docker save "${ECR_IMAGE}:${IMAGE_TAG}" "${ECR_IMAGE}:${IMAGE_LATEST}" -o image.tar
    - echo "Docker image built successfully"

  artifacts:
    paths:
      - image.tar

push_image:
  stage: push

  image: docker:29.8.0-cli

  services:
    - name: docker:29.8.0-dind
      alias: docker
      variables:
        HEALTHCHECK_TCP_PORT: "2375"

  before_script:
    - apk add --no-cache aws-cli

  script:
    - echo "Loading Docker image..."
    - docker load -i image.tar

    - export ECR_REGISTRY="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_DEFAULT_REGION}.amazonaws.com"
    - export ECR_IMAGE="${ECR_REGISTRY}/${ECR_REPOSITORY}"

    - echo "Logging in to Amazon ECR..."
    - ECR_PASSWORD="$(aws ecr get-login-password --region "${AWS_DEFAULT_REGION}")"
    - echo "${ECR_PASSWORD}" | docker login --username AWS --password-stdin "${ECR_REGISTRY}"
    - echo "Pushing Docker image..."
    - docker push "${ECR_IMAGE}:${IMAGE_TAG}"
    - docker push "${ECR_IMAGE}:${IMAGE_LATEST}"

    - echo "Successfully pushed image to ECR"
